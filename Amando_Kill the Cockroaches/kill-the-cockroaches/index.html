<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kill the Cockroaches!</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <script defer src="app.js"></script>
</head>
<body>
  <h1>Kill the Cockroaches!</h1>
  <div class="game-info">
    <span id="timer">90 sec</span>
    <span id="kills">0 kills</span>
    <button id="sound-toggle">🔊</button>
  </div>
  <div id="game-screen">
    <div id="start-screen">
      <p>Are you ready to kill the Cockroaches!</p>
      <button id="start-btn">▶ Start Game</button>
    </div>
  </div>
  <footer>In 90 seconds kill Cockroaches as you can. Enjoy Killing!</footer>
</body>
</html>
